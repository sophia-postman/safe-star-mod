$kind: http-request
url: "{{baseUrl}}/driver/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: "1001"
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer"
          }
        },
        "required": [
          "value"
        ]
      }
settings: {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("La respuesta contiene profileId", function () {
        const response = pm.response.json();
        pm.expect(response).to.have.property("profileId");
      });
examples: ./.resources/Retrieve Driver Safety Profile.resources/examples
order: 4000

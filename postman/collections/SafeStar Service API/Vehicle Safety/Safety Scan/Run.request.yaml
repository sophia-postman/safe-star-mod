$kind: http-request
url: "{{baseUrl}}/run"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "vehicle": "1002",
      "driver": "1001"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "vehicle": {
          "type": "string"
        },
        "driver": {
          "type": "string"
        }
      }
    }
examples: ./.resources/Run.resources/examples
order: 1000

$kind: http-request
url: "{{baseUrl}}/diagnostics/generate/:vehicleId"
method: POST
headers:
  Accept: application/json
pathVariables:
  - key: vehicleId
    value: "1002"
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer"
          }
        },
        "required": [
          "value"
        ]
      }
examples: ./.resources/Run diagnostic and generate report.resources/examples
order: 1000

  /diagnostics/{id}:
    get:
      summary: Retrieve diagnostic report
      responses:
        '200':
          description: 200 - Report sucessfully retrieve
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                  report:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        format: date-time
                      status:
                        type: string
                      job:
                        type: object
                        properties:
                          jobId:
                            type: string
                          type:
                            type: string
                          completed:
                            type: boolean
                          durationMs:
                            type: integer
                          apiVersion:
                            type: string
                      vehicle:
                        type: object
                        properties:
                          id:
                            type: integer
                          vin:
                            type: string
                          make:
                            type: string
                          model:
                            type: string
                          year:
                            type: integer
                          mileage:
                            type: integer
                      checks:
                        type: object
                        properties:
                          tpms:
                            type: object
                            properties:
                              status:
                                type: string
                              severity:
                                type: string
                          tailLights:
                            type: object
                            properties:
                              status:
                                type: string
                              severity:
                                type: string
                          oilPressure:
                            type: object
                            properties:
                              status:
                                type: string
                              severity:
                                type: string
                          sensors:
                            type: object
                            properties:
                              status:
                                type: string
                              severity:
                                type: string
                          defrost:
                            type: object
                            properties:
                              status:
                                type: string
                              severity:
                                type: string
                          airbags:
                            type: object
                            properties:
                              status:
                                type: string
                              severity:
                                type: string
                          battery:
                            type: object
                            properties:
                              status:
                                type: string
                              voltage:
                                type: number
                              severity:
                                type: string
                      diagnostics:
                        type: object
                        properties:
                          newCodeDetected:
                            type: boolean
                          activeCodes:
                            type: array
                            items:
                              type: object
                              properties:
                                code:
                                  type: string
                                description:
                                  type: string
                                severity:
                                  type: string
                                recommendedAction:
                                  type: string
                          failureReason:
                            type: string
                      summary:
                        type: object
                        properties:
                          overallSafetyStatus:
                            type: string
                          criticalIssues:
                            type: integer
                          majorIssues:
                            type: integer
                          moderateIssues:
                            type: integer
                          notes:
                            type: string
              example:
                id: '{{$pathSegments ''1''}}'
                status: success
                report:
                  timestamp: '2026-03-13T10:15:00Z'
                  status: FAILED
                  job:
                    jobId: JOB-784512
                    type: VehicleSafetyScan
                    completed: true
                    durationMs: 4823
                    apiVersion: v2.4.1
                  vehicle:
                    id: 1
                    vin: 1HGCM82633A004352
                    make: Honda
                    model: Accord
                    year: 2020
                    mileage: 45000
                  checks:
                    tpms:
                      status: OK
                      severity: NONE
                    tailLights:
                      status: OK
                      severity: NONE
                    oilPressure:
                      status: OK
                      severity: NONE
                    sensors:
                      status: OK
                      severity: NONE
                    defrost:
                      status: OK
                      severity: NONE
                    airbags:
                      status: OK
                      severity: NONE
                    battery:
                      status: OK
                      voltage: 12.6
                      severity: NONE
                  diagnostics:
                    newCodeDetected: true
                    activeCodes:
                      - code: P0300
                        description: Random/Multiple Cylinder Misfire Detected
                        severity: CRITICAL
                        recommendedAction: >-
                          Inspect ignition system, spark plugs, and fuel
                          injectors immediately.
                      - code: P0420
                        description: Catalyst System Efficiency Below Threshold
                        severity: MAJOR
                        recommendedAction: Inspect catalytic converter and oxygen sensors.
                      - code: P0455
                        description: Evaporative Emission System Leak (Large Leak)
                        severity: MAJOR
                        recommendedAction: Check fuel cap, EVAP hoses, and purge valve.
                      - code: P0171
                        description: System Too Lean (Bank 1)
                        severity: MAJOR
                        recommendedAction: >-
                          Inspect for vacuum leaks and check fuel delivery
                          system.
                      - code: P0128
                        description: >-
                          Coolant Thermostat Temperature Below Regulating
                          Temperature
                        severity: MODERATE
                        recommendedAction: Inspect thermostat and coolant temperature sensor.
                    failureReason: >-
                      Active diagnostic trouble codes detected during safety
                      scan.
                  summary:
                    overallSafetyStatus: NOT SAFE TO RELEASE
                    criticalIssues: 1
                    majorIssues: 3
                    moderateIssues: 1
                    notes: >-
                      Vehicle passed physical safety component checks but failed
                      due to active engine diagnostic trouble codes.
        '500':
          description: 500 - Unexpected Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: object
              example:
                error:
                  code: UNEXPECTED_ERROR
                  message: An unexpected error occurred.
                  details: {}
